onlyBuiltDependencies:
  - better-sqlite3

# better-sqlite3 and esbuild ship prebuilt native binaries their postinstall
# scripts unpack; the app (better-sqlite3) and vite/vitest's dev toolchain
# (esbuild) won't run without them. @swc/core is Next.js's compiler binary —
# same story for `next build`/`next dev`. The rest are transitive dependencies
# nothing here actually invokes, so they stay denied (least privilege).
allowBuilds:
  better-sqlite3: true
  esbuild: true
  '@swc/core': true
  '@parcel/watcher': false
  unrs-resolver: false
  vue-demi: false

# Transitive deps still resolving below their Dependabot-patched floor after
# bumping next/vitest/ws directly. pnpm ignores these entirely if package.json
# also defines pnpm.overrides, so they live here only.
overrides:
  shell-quote: ^1.9.0
  brace-expansion@1: ^1.1.18
  brace-expansion@2: ^2.1.4
  browserslist: ^4.28.7
  defu: ^6.1.5
  fast-uri: ^3.1.6
  flatted: ^3.4.2
  js-yaml: ^4.3.2
  minimatch@3: ^3.1.4
  minimatch@9: ^9.0.7
  nanoid@3: ^3.3.18
  nanoid@5: ^5.1.16
  picomatch@2: ^2.3.2
  picomatch@4: ^4.0.4
  postcss: ^8.5.23
  ajv: ^6.14.0
  baseline-browser-mapping: ^2.11.0
  fflate@0.6: ^0.6.11
  fflate@0.8: ^0.8.3
  next-intl: ^4.9.2
  ts-deepmerge: ^8.0.0
  unhead: ^2.1.13
  yaml: ^2.8.3
  '@ai-sdk/provider-utils': ^4.0.33
  '@babel/core': ^7.29.6
  icu-minify: ^4.9.2
  postcss-selector-parser: ^6.1.3
  '@humanfs/node': ^0.16.8
  rollup: ^4.59.0
